<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mise Nora - Meu Perfil</title>
    <link rel="stylesheet" href="style.css">
    <!-- Carrega a biblioteca do Supabase no <head> ou no início dos scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./assets/js/conexao.js"></script>
</head>
<body>

    <main>
        <main>

<!-- Seção: Foto de Perfil -->
<section id="secao-avatar">
    <div class="avatar-tag-container">
        <img src="" alt="Foto de perfil do usuário" id="img-perfil">
        
        <!-- Botão/Rótulo integrado por cima da foto -->
        <label for="foto-input" class="botao-alterar-foto" title="Alterar foto">
            📷 Alterar Foto
        </label>
        <input type="file" id="foto-input" name="foto" accept="image/*" style="display: none;">
    </div>
</section>

 <!-- Menu de Abas / Botões de Navegação -->
<div class="menu-abas-perfil">
    <button type="button" class="botao botao-aba ativo" data-alvo="secao-avatar">Foto</button>
    <button type="button" class="botao botao-aba" data-alvo="secao-dados-pessoais">Dados Pessoais</button>
    <button type="button" class="botao botao-aba" data-alvo="secao-historico">Histórico</button>
    <button type="button" class="botao botao-aba" data-alvo="secao-seguranca">Segurança</button>
    <button type="button" class="botao botao-aba" data-alvo="secao-preferencias">Preferências</button>
    <button type="button" class="botao botao-aba" data-alvo="secao-acoes-conta">Conta</button>
</div>

        <!-- Seção: Informações Pessoais -->
        <section id="secao-dados-pessoais">
            <h2>Informações Pessoais</h2>
            <form id="form-dados-pessoais">
                <div>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="telefone">Telefone / WhatsApp:</label>
                    <input type="tel" id="telefone" name="telefone">
                </div>

                <button type="submit" id="btn-salvar-pessoais">Salvar Informações Pessoais</button>
            </form>
        </section>

        <!-- Seção: Histórico de Pedidos -->
        <section id="secao-historico">
            <h2>Histórico de Pedidos</h2>
            
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Data</th>
                        <th>Itens</th>
                        <th>Valor Total</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="lista-historico">
                    <!-- Os pedidos anteriores do usuário aparecerão aqui via JavaScript -->
                </tbody>
            </table>

            <p id="historico-vazio">Você ainda não realizou nenhum pedido.</p>
        </section>

        <!-- Seção: Configurações da Conta e Segurança -->
        <section id="secao-seguranca">
            <h2>Configurações e Segurança</h2>
            <form id="form-seguranca">
                <div>
                    <label for="senha-atual">Senha Atual:</label>
                    <input type="password" id="senha-atual" name="senhaAtual">
                </div>

                <div>
                    <label for="nova-senha">Nova Senha:</label>
                    <input type="password" id="nova-senha" name="novaSenha">
                </div>

                <div>
                    <label for="confirmar-senha">Confirmar Nova Senha:</label>
                    <input type="password" id="confirmar-senha" name="confirmarSenha">
                </div>

                <button type="submit" id="btn-alterar-senha">Alterar Senha</button>
            </form>
        </section>

        <!-- Seção: Preferências de Notificação -->
        <section id="secao-preferencias">
            <h2>Preferências de Notificação</h2>
            <form id="form-preferencias">
                <div>
                    <input type="radio" id="notif-email" name="notificacoes" value="email">
                    <label for="notif-email">Receber notificações por e-mail</label>
                </div>

                <div>
                    <input type="radio" id="notif-whatsapp" name="notificacoes" value="whatsapp">
                    <label for="notif-whatsapp">Receber lembretes via WhatsApp</label>
                </div>

                <div>
                    <input type="radio" id="notif-nenhuma" name="notificacoes" value="nenhuma" checked>
                    <label for="notif-nenhuma">Não receber notificações</label>
                </div>

                <button type="submit" id="btn-salvar-preferencias">Salvar Preferências</button>
            </form>
        </section>

        <!-- Seção: Ações da Conta -->
        <section id="secao-acoes-conta">
            <h2>Ações da Conta</h2>
          <!-- Exemplo de como deve estar no seu HTML -->
        <button id="btn-logout" class="botao">Sair</button>
        <button id="btn-excluir-conta" class="botao">Excluir Conta</button>
        </section>

    </main>

    <footer>
        <nav class="menu-inferior">
            <a href="index.html" class="botaorodape ativo" title="Início">
                <svg viewBox="0 0 24 24" class="icone-vermelho">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </a>
            <a href="reservar.html" class="botaorodape" title="Reservar Mesa">
                <svg viewBox="0 0 24 24" class="icone-vermelho">
                    <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0-2-.9-2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
                </svg>
            </a>
            <a href="carrinho.html" class="botaorodape" title="Carrinho">
                <svg viewBox="0 0 24 24" class="icone-vermelho">
                    <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </a>
            <!-- BOTÃO DE PERFIL REINSERIDO NO RODAPÉ -->
            <a href="perfil.html" class="botaorodape" title="Perfil">
                <svg viewBox="0 0 24 24" class="icone-vermelho">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </a>
        </nav>
    </footer>
<script type="module" src="./assets/js/app.js"></script>
<script type="module" src="./assets/js/cart.js"></script>

</body>
</html>
