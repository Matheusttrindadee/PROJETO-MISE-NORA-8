<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mise Nora - Confirmação de Reserva</title>
    <!-- Link para o seu CSS principal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Conteúdo Principal da Reserva -->
    <main class="container-principal" style="padding-top: 30px;">
        <div class="container-apresentacao">
            <h2>Agendamento de Reserva</h2>
            <p id="numero-mesa" style="font-size: 1.2rem; color: var(--accent-red); margin-top: 10px; font-weight: bold;">Mesa: Carregando...</p>
        </div>

        <form id="form-confirmar-reserva">
            <h3 style="margin-top: 0; border: none; padding: 0; font-size: 1.2rem; margin-bottom: 20px;">Detalhes do Atendimento</h3>
            
            <label for="nome-cliente">Nome do Responsável:</label>
            <input type="text" id="nome-cliente" placeholder="Digite seu nome completo" required style="margin-bottom: 15px;">

            <label for="data-reserva">Data da Reserva:</label>
            <input type="date" id="data-reserva" required style="margin-bottom: 15px;">

            <label for="horario-reserva">Horário:</label>
            <select id="horario-reserva" required style="margin-bottom: 15px;">
                <option value="" disabled selected>Selecione um horário</option>
                <option value="12:00">12:00 - Almoço</option>
                <option value="12:30">12:30 - Almoço</option>
                <option value="13:00">13:00 - Almoço</option>
                <option value="19:00">19:00 - Jantar</option>
                <option value="19:30">19:30 - Jantar</option>
                <option value="20:00">20:00 - Jantar</option>
                <option value="20:30">20:30 - Jantar</option>
                <option value="21:00">21:00 - Jantar</option>
            </select>

            <label for="qtd-pessoas">Número de Pessoas:</label>
            <input type="number" id="qtd-pessoas" min="1" max="10" value="2" required style="margin-bottom: 15px;">

            <label for="observacoes">Observações (Opcional):</label>
            <textarea id="observacoes" placeholder="Ex: Cadeira de bebê, restrição alimentar..." rows="3" style="margin-bottom: 20px;"></textarea>

            <button type="submit" id="btn-confirmar-reserva">Confirmar Reserva</button>
        </form>
    </main>

    <!-- Menu Inferior Fixo -->
    <footer>
        <nav class="menu-inferior">
            <a href="index.html" class="botaorodape ativo" title="Início">
                <svg viewBox="0 0 24 24" class="icone-vermelho">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </a>
            <a href="reservar.html" class="botaorodape" title="Reservar Mesa">
                <svg viewBox="0 0 24 24" class="icone-vermelho">
                    <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0-2-.9-2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
                </svg>
            </a>
            <a href="carrinho.html" class="botaorodape" title="Carrinho">
                <svg viewBox="0 0 24 24" class="icone-vermelho">
                    <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </a>
            <!-- BOTÃO DE PERFIL REINSERIDO NO RODAPÉ -->
            <a href="perfil.html" class="botaorodape" title="Perfil">
                <svg viewBox="0 0 24 24" class="icone-vermelho">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </a>
        </nav>
    </footer>

    <!-- Script Principal -->
    <script type="module" src="assets/js/app.js"></script>
    <script>
        // Exibe o número da mesa atual ao carregar
        document.addEventListener('DOMContentLoaded', () => {
            const mesaAtual = localStorage.getItem('mise_mesa') || '1';
            const elMesa = document.getElementById('numero-mesa');
            if (elMesa) {
                elMesa.textContent = `Mesa: ${mesaAtual}`;
            }
        });

        // Ação ao confirmar a reserva enviando para a API
        document.getElementById('form-confirmar-reserva')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = document.getElementById('nome-cliente').value;
            const dataReserva = document.getElementById('data-reserva').value;
            const horario = document.getElementById('horario-reserva').value;
            const qtdPessoas = document.getElementById('qtd-pessoas').value;
            const observacoes = document.getElementById('observacoes').value;
            const mesa = localStorage.getItem('mise_mesa') || '1';

            try {
                // Mudado para rota relativa /api/reservas para evitar bloqueios de porta/host
                const resposta = await fetch('/api/reservas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome_cliente: nome,
                        data_reserva: dataReserva,
                        horario_reserva: horario,
                        qtd_pessoas: Number(qtdPessoas),
                        numero_mesa: mesa,
                        observacoes: observacoes
                    })
                });

                const resultado = await resposta.json();

                if (resposta.ok && resultado.sucesso) {
                    alert(`Reserva da Mesa ${mesa} confirmada e salva com sucesso!`);
                    window.location.href = 'index.html';
                } else {
                    alert("Erro ao realizar reserva: " + (resultado.erro || "Erro desconhecido"));
                }
            } catch (error) {
                console.error("Erro ao conectar com o servidor:", error);
                alert("Erro ao conectar com o servidor. Verifique o console.");
            }
        });
    </script>
</body>
</html>
